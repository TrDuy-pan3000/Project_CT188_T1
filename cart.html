<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Giỏ hàng - Bếp Nhà Ngọ. Xem và thanh toán đơn hàng món ăn Tết của bạn.">
    <title>Giỏ hàng - Bếp Nhà Ngọ</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="icon" type="image/png" href="assets/images/ui/logo.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="assets/css/index.css">
    <link rel="stylesheet" href="assets/css/cart.css">
</head>

<body>
    <header class="header"></header>

    <main class="cart-wrapper">
    <!-- Main Content -->
     <div class="container">
        <div class="cart-header">
            <h1>🐴 Ngựa Phi Thần Tốc - Giao Tết Tận Nơi</h1>
            <div class="subtitle">✨ Để Bếp Nhà Ngọ lo toan, bạn chỉ việc đón Xuân an nhàn ✨</div>
        </div>

        <div class="main-content">
            <!-- KHU VỰC TRÁI - Danh sách Tết -->
            <div class="left-section">
                <h2 class="section-title">🏮 Danh Sách sắm Tết 🏮</h2>
                <div id="cartItems">
                    <!-- Sản phẩm sẽ được thêm vào đây -->
                </div>
                <div class="total-section">
                    <div class="total-row">
                        <span>💰 Tổng Tiền:</span>
                        <span id="totalAmount">0đ</span>
                    </div>
                </div>

                <!-- Con ngựa b4 (vespa giao hàng) - góc dưới trái cột trái -->
                <img src="assets/images/mascots/b4.png" alt="Ngựa giao hàng" class="horse-b4">
            </div>
                <!-- KHU VỰC PHẢI - Thanh toán -->
            <div class="right-section">
                <!-- Con ngựa b3 nhô lên đỉnh cột phải -->
                <img src="assets/images/mascots/b3.png" alt="Ngựa Tết" class="envelope-decoration">
                <h2 class="section-title"> Thông Tin Nhận Hàng </h2>
                <form id="checkoutForm">
                    <div class="form-group">
                        <label for="customerName">👤 Họ và Tên:</label>
                        <input type="text" id="customerName"  name="customerName" placeholder="Nhập họ tên của bạn" required>
                    </div>

                    <div class="form-group">
                        <label for="customerAddress">🏠 Địa Chỉ Nhận Hàng:</label>
                        <textarea id="customerAddress" name="customerAddress" placeholder="Nhập địa chỉ chi tiết (số nhà, đường, phường, quận/huyện, tỉnh/thành phố)" required></textarea>
                    </div>

                    <div class="form-group">
                        <label for="customerPhone">📞 Số Điện Thoại:</label>
                        <input type="tel" id="customerPhone" name="customerPhone" placeholder="Nhập số điện thoại của bạn" required>
                    </div>

                    <div class="form-group">
                        <label for="customerNote">📝 Ghi Chú (Nếu có):</label>
                        <textarea id="customerNote" name="customerNote" placeholder="Ghi chú thêm về đơn hàng"></textarea>
                    </div>

                <div class="payment-methods">
                            <div class="form-group">
                                <label> Hình Thức Thanh Toán:</label>
                                <div class="payment-option">
                                    <input type="radio" id="cod" name="payment" value="cod" checked>
                                    <label for="cod"> Thanh Toán Khi Nhận Hàng (COD)</label>
                                </div>
                                <div class="payment-option">
                                    <input type="radio" id="transfer" name="payment" value="transfer">
                                    <label for="transfer"> Chuyển Khoản Ngân Hàng</label>
                                </div>
                            </div>
                        </div>
                        <button type="button" class="checkout-btn" onclick="checkout()">
                            MÃ ĐÁO THÀNH CÔNG 
                        </button>
                    </form>
            </div>
        </div>
    </div>

    <div class="notification" id="notification"></div>
    </main>

    <footer class="footer"></footer>

    <script src="assets/js/script.js"></script>
    <script src="assets/js/main.js"></script>
    <script src="assets/js/cart.js"></script>
</body>

</html>
