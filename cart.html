<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giỏ hàng - Website Bán Hàng</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="assets/css/cart.css">
</head>
<body>
    <!-- Header -->
    <header>
        <div class="logo">LOGO</div>
        <nav>
            <ul>
                <li><a href="index.html">Trang chủ</a></li>
                <li><a href="products.html">Sản phẩm</a></li>
                <li><a href="cart.html">Giỏ hàng</a></li>
                <li><a href="contact.html">Liên hệ</a></li>
            </ul>
        </nav>
    </header>

    <!-- Main Content -->

<main class="cart-wrapper">
    <section class="cart-left note-paper">
        <h2>Danh sách sắm Tết</h2>
        <div id ="cart-display-area" class="cart-items">

        </div>
        <div class="cart-total">
            <h3>Tổng tiền: <span id="total-amount">0</span></h3>
        </div>
    </section>

    <section class="cart-right red-envelope">
        <h2>Thông tin nhận hàng</h2>
        
        <form action="#">
            <div class="input-group">
                <label for="username">Tên người nhận:</label>
                <input type="text" id="username" placeholder="Nhập họ tên...">
            </div>
            <div class="input-group">
                <label for="phone">Số điện thoại:</label>
                <input type="tel" id="phone" placeholder="Nhập số điện thoại...">
            </div>
            <div class="input-group">
                <label for="address">Địa chỉ nhận lộc:</label>
                <textarea id="address" rows="3" placeholder="Địa chỉ giao hàng chi tiết..."></textarea>
            </div>

            <div class="payment-methods">
                <p>Phương thức thanh toán:</p>
                <div class="payment-item">
                    <input type="radio" id="cod" name="pay" value="COD" checked>
                    <label for="cod">Tiền mặt (COD)</label>
                </div>
                <div class="payment-item">
                    <input type="radio" id="qr" name="pay" value="QR">
                    <label for="qr">Chuyển khoản QR</label>
                </div>
            </div>

            <button type="submit" class="btn-checkout">CHỐT ĐƠN - RƯỚC LỘC</button>
        </form>
    </section>
</main>

    <!-- Footer -->
    <footer>
        <p>&copy; 2026 Group 1 - Website Bán Hàng</p>
    </footer>

    <script src="assets/js/main.js"></script>
    <script src="assets/js/cart.js"></script>
    <div id="myModal">
    <div>
        <div class="modal-icon">🧧</div>
        <h3>Hết lộc sao ta?</h3>
        <p>Bạn thực sự muốn bỏ món này khỏi giỏ Tết sao?</p>
        <button id="btnYes">XÓA LỘC</button>
        <button id="btnNo">GIỮ LẠI LỘC</button>
    </div>
</div>
</body>

</html>
