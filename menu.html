<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Thực đơn Bếp Nhà Ngọ - Bánh tét, bánh chưng, đồ nhậu Tết và nhiều món ngon khác. Đặt hàng ngay!"
    />
    <title>Thực đơn - Bếp Nhà Ngọ</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="icon" type="image/png" href="assets/images/logo.png" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
    <link rel="stylesheet" href="assets/css/style.css" />
    <link rel="stylesheet" href="assets/css/index.css" />
    <link rel="stylesheet" href="assets/css/menu.css" />
  </head>

  <body>
    <!-- ======================== HEADER - Thanh điều hướng cố định trên cùng ======================== -->
    <header class="header"></header>

    <main style="padding-top: 5rem">
      <section class="story-hero" id="storyHero">
        <!-- Ảnh nền -->
        <div class="menu-hero-bg" id="menuHeroBg">
          <img src="" alt="Hero Image" />
          <!-- Overlay đen dốc để text hiện lên sắc nét -->
          <div class="menu-hero-overlay"></div>
        </div>

        <!-- Nội dung trung tâm của Hero Banner -->
        <div class="menu-hero-content menu-hero-enter" id="menuHeroContent">
          <div class="menu-hero-sub">GIAN BẾP NHÀ NGỌ</div>
          <h1 class="menu-hero-title">
            <span>Trọn Vị Quê Nhà</span>
            <span>Đậm Đà Ngày Xuân</span>
          </h1>
          <div class="menu-hero-divider"></div>
          <p class="menu-hero-desc">
            Từ gian bếp nhỏ, Nhà Ngọ gói ghém trọn vẹn hương vị Tết xưa, mang sự
            ấm áp và tình thân lên mâm cỗ sum vầy của gia đình bạn.
          </p>
        </div>
      </section>

      <div class="filter-bar">
        <button>Tất cả</button>
        <button>Bánh truyền thống</button>
        <button>Quà cáp</button>
        <button>Tết nhâm nhi</button>
      </div>

      <section class="menu">
        <div class="menu-grid">

          <div class="menu-card" data-category="banh-tet">
            <a href="detail.html?id=" class="image-wrapper">
              <img src="assets/images/product-combo-tet.jpg" alt="Bánh Tết" />
            </a>
            <div class="content-wrapper">
              <span class="card-tag trad">Truyền thống</span>
              <h3 class="food-name">Bánh Tét</h3>
              <p class="short-description">
                Bánh tét nếp lá cẩm tím, nhân đậu xanh thịt mỡ, hương vị đặc
                trưng miền Tây
              </p>
              <div class="card-bottom">
                <p class="price">350.000₫</p>
                <a href="detail.html" class="btn-add">
                  <i class="fas fa-shopping-cart"></i> Thêm
                </a>
              </div>
            </div>
          </div>
          
        </div>
      </section>
    </main>

    <footer class="footer"></footer>
    <script src="assets/js/script.js"></script>
    <script src="assets/js/main.js"></script>
    <script src="assets/js/menu.js"></script>
  </body>
</html>
