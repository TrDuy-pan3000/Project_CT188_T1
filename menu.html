<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Thực đơn Bếp Nhà Ngọ - Bánh tét, bánh chưng, đồ nhậu Tết và nhiều món ngon khác. Đặt hàng ngay!"
    />
    <title>Thực đơn - Bếp Nhà Ngọ</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="icon" type="image/png" href="assets/images/logo.png" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
    <link rel="stylesheet" href="assets/css/style.css" />
    <link rel="stylesheet" href="assets/css/index.css" />
    <link rel="stylesheet" href="assets/css/menu.css" />
  </head>

  <body>
    <!-- ======================== HEADER - Thanh điều hướng cố định trên cùng ======================== -->
    <header class="header"></header>

    <main style="padding-top: 5rem">
      <h1
        style="
          font-family: &quot;Playfair Display&quot;, serif;
          text-align: center;
          padding: 2rem;
          color: var(--brown-dark);
        "
      >
        🍜 Thực Đơn Nhà Ngọ
      </h1>

      <div class="top-actions">
        <button id="filterBtn">Bộ lọc</button>
        <div class="search-box">
          <span class="search-icon">🔍</span>
          <input type="search" id="searchInput" placeholder="Tìm món ngon..." />
        </div>
      </div>

      <div class="overlay" id="overlay"></div>

      <div class="filter-modal" id="filterModal">
        <h3>Chọn danh mục</h3>
        <div class="category-list">
          <button class="category-btn" data-value="all">Tất cả</button>
          <button class="category-btn" data-value="banh-tet">Bánh Tết</button>
          <button class="category-btn" data-value="tet-nham-nhi">
            Tết Nhâm Nhi
          </button>
          <button class="category-btn" data-value="do-uong">Đồ Uống</button>
        </div>
        <div class="actions">
          <button id="closeFilter">Hủy</button>
          <button id="applyFilter" disabled>Áp dụng</button>
        </div>
      </div>

      <div class="menu-grid">
        <div class="menu-card" data-category="banh-tet">
          <div class="image-wrapper">
            <img src="assets/images/product-combo-tet.jpg" alt="Bánh Tết" />
            <span class="badge new">Mới</span>
          </div>
          <h3 class="food-name">Bánh Tét</h3>
          <span class="price">45.000₫</span>
          <button onclick="location.href = 'detail.html'" class="buy-btn">
            Xem chi tiết
          </button>
        </div>
        <div class="menu-card" data-category="do-uong">
          <div class="image-wrapper">
            <img src="assets/images/product-bia-cao-cap.jpg" alt="bia" />
            <span class="badge new">Mới</span>
          </div>
          <h3 class="food-name">Bia</h3>
          <span class="price">345.000₫</span>
          <button onclick="location.href = 'detail.html'" class="buy-btn">
            Xem chi tiết
          </button>
        </div>
        <div class="menu-card" data-category="tet-nham-nhi">
          <div class="image-wrapper">
            <img src="assets/images/product-combo-nhau.jpg" alt="Đồ nhậu" />
            <span class="badge new">Mới</span>
          </div>
          <h3 class="food-name">Đồ nhậu</h3>
          <span class="price">45.000₫</span>
          <button onclick="location.href = 'detail.html'" class="buy-btn">
            Xem chi tiết
          </button>
        </div>
        <div class="menu-card" data-category="banh-tet">
          <div class="image-wrapper">
            <img
              src="assets/images/product-banh-tet-chuoi-1.jpg"
              alt="Bánh Tét Chuối"
            />
            <span class="badge new">Best Seller</span>
          </div>
          <h3 class="food-name">Bánh Tét Chuối</h3>
          <span class="price">150.000₫</span>
          <button onclick="location.href = 'detail.html'" class="buy-btn">
            Xem chi tiết
          </button>
        </div>
        <div class="menu-card" data-category="banh-tet">
          <div class="image-wrapper">
            <img
              src="assets/images/product-banh-tet-dau-1.jpg"
              alt="Bánh Tét Đậu"
            />
            <span class="badge new">Mới</span>
          </div>
          <h3 class="food-name">Bánh Tét Đậu</h3>
          <span class="price">120.000₫</span>
          <button onclick="location.href = 'detail.html'" class="buy-btn">
            Xem chi tiết
          </button>
        </div>
        <div class="menu-card" data-category="tet-nham-nhi">
          <div class="image-wrapper">
            <img src="assets/images/product-combo-nhau.jpg" alt="Combo Nhậu" />
            <span class="badge new">Hot</span>
          </div>
          <h3 class="food-name">Combo Nhậu Tết</h3>
          <span class="price">250.000₫</span>
          <button onclick="location.href = 'detail.html'" class="buy-btn">
            Xem chi tiết
          </button>
        </div>
      </div>
    </main>

    <footer class="footer"></footer>
    <script src="assets/js/script.js"></script>
    <script src="assets/js/main.js"></script>
    <script src="assets/js/menu.js"></script>
  </body>
</html>
