<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Đăng nhập hoặc đăng ký tài khoản Bếp Nhà Ngọ">
    <title>Đăng nhập - Bếp Nhà Ngọ</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" href="assets/images/logo.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="assets/css/index.css">
    <link rel="stylesheet" href="assets/css/login.css">
</head>
<body>
    <header class="header"></header>

    <main class="auth-page">
        <!-- Cột trái — trang trí -->
        <div class="auth-hero">
            <div class="auth-hero-content">
                <h1>Chào mừng đến<br><span>Bếp Nhà Ngọ</span></h1>
                <p class="auth-hero-slogan">🐴 Ăn là Mê, Rước Lộc về!</p>
                <p class="auth-hero-desc">Đăng nhập để đặt hàng nhanh hơn, theo dõi đơn hàng và nhận ưu đãi mùa Tết!</p>
                <ul class="auth-hero-perks">
                    <li><i class="fas fa-bolt"></i> Đặt hàng siêu tốc</li>
                    <li><i class="fas fa-gift"></i> Nhận voucher giảm giá</li>
                    <li><i class="fas fa-truck"></i> Theo dõi giao hàng</li>
                </ul>
            </div>
        </div>

        <!-- Cột phải — form -->
        <div class="auth-form-side">
           <img src="assets/images/blogin.png" alt="Ngựa Tết mời đăng nhập" class="top-mascot">
            <div class="auth-card">
                <h2 class="auth-title">Tài khoản</h2>
                <p class="auth-subtitle">Đăng nhập hoặc tạo tài khoản mới</p>

                <!-- Lựa chọn -->
                <div id="choiceBox" class="auth-choice">
                    <button id="showLogin" class="auth-btn primary"><i class="fas fa-sign-in-alt"></i> Đăng nhập</button>
                    <div class="auth-divider"><span>hoặc</span></div>
                    <button id="showRegister" class="auth-btn outline"><i class="fas fa-user-plus"></i> Tạo tài khoản mới</button>
                </div>

                <!-- Form đăng nhập -->
                <form id="loginForm" class="auth-form hidden">
                    <button type="button" class="backBtn"><i class="fas fa-arrow-left"></i> Quay lại</button>
                    <h3 class="form-heading">Đăng nhập</h3>
                    <div class="input-group">
                        <label for="loginEmail"><i class="fas fa-envelope"></i> Email</label>
                        <input type="email" id="loginEmail" placeholder="vd: ngua@bepnhango.vn" class="auth-input" required>
                    </div>
                    <div class="input-group">
                        <label for="loginPassword"><i class="fas fa-lock"></i> Mật khẩu</label>
                        <div class="password-box">
                            <input type="password" id="loginPassword" placeholder="Nhập mật khẩu" class="auth-input" required>
                            <i class="fa-solid fa-eye togglePassword"></i>
                        </div>
                    </div>
                    <div class="form-options">
                        <label class="remember-me"><input type="checkbox"> Ghi nhớ</label>
                        <a href="#" class="forgot-link">Quên mật khẩu?</a>
                    </div>
                    <button type="submit" class="auth-btn primary"><i class="fas fa-sign-in-alt"></i> Đăng nhập</button>
                </form>

                <!-- Form đăng ký -->
                <form id="registerForm" class="auth-form hidden">
                    <button type="button" class="backBtn"><i class="fas fa-arrow-left"></i> Quay lại</button>
                    <h3 class="form-heading">Tạo tài khoản</h3>
                    <div class="input-group">
                        <label for="name"><i class="fas fa-user"></i> Họ và tên</label>
                        <input type="text" id="name" placeholder="vd: Nguyễn Văn Ngọ" class="auth-input" required>
                    </div>
                    <div class="input-group">
                        <label for="registerEmail"><i class="fas fa-envelope"></i> Email</label>
                        <input type="email" id="registerEmail" placeholder="vd: ngua@bepnhango.vn" class="auth-input" required>
                    </div>
                    <div class="input-group">
                        <label for="registerPhone"><i class="fas fa-phone"></i> Số điện thoại</label>
                        <input type="tel" id="registerPhone" placeholder="vd: 0909 123 456" class="auth-input" required>
                    </div>
                    <div class="input-group">
                        <label for="registerPassword"><i class="fas fa-lock"></i> Mật khẩu</label>
                        <div class="password-box">
                            <input type="password" id="registerPassword" placeholder="Tối thiểu 6 ký tự" class="auth-input" required>
                            <i class="fa-solid fa-eye togglePassword"></i>
                        </div>
                    </div>
                    <div class="input-group">
                        <label for="confirmPassword"><i class="fas fa-lock"></i> Xác nhận mật khẩu</label>
                        <div class="password-box">
                            <input type="password" id="confirmPassword" placeholder="Nhập lại mật khẩu" class="auth-input" required>
                            <i class="fa-solid fa-eye togglePassword"></i>
                        </div>
                    </div>
                    <button type="submit" class="auth-btn primary"><i class="fas fa-user-plus"></i> Đăng ký</button>
                </form>
            </div>
        </div>
    </main>

    <footer class="footer"></footer>
    <script src="assets/js/main.js"></script>
    <script src="assets/js/script.js"></script>
    <script src="assets/js/login.js"></script>
</body>
</html>
