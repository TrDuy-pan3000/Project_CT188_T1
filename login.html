<!DOCTYPE html>
<!-- Khai báo đây là tài liệu HTML5 -->

<html lang="vi">
<!-- Ngôn ngữ trang là tiếng Việt -->

<head>
    <meta charset="UTF-8">
    <!-- Hỗ trợ hiển thị tiếng Việt (Unicode) -->

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Responsive: giúp web hiển thị đúng trên mobile -->

    <meta name="description" content="Đăng nhập hoặc đăng ký tài khoản Bếp Nhà Ngọ">
    <!-- Mô tả trang (SEO, Google) -->

    <title>Đăng nhập - Bếp Nhà Ngọ</title>
    <!-- Tiêu đề tab trình duyệt -->

    <!-- Tối ưu load font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <!-- Import font chữ -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Icon tab -->
    <link rel="icon" type="image/png" href="assets/images/ui/logo.png">

    <!-- Font Awesome (icon như eye, lock, user...) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <!-- CSS tổng -->
    <link rel="stylesheet" href="assets/css/style.css">

    <!-- CSS riêng trang index -->
    <link rel="stylesheet" href="assets/css/index.css">

    <!-- CSS riêng trang login -->
    <link rel="stylesheet" href="assets/css/login.css">
</head>

<body>

    <!-- HEADER (load động bằng JS) -->
    <header class="header"></header>

    <main class="auth-page">
        <!-- MAIN chia 2 cột -->

        <!-- ================= LEFT: HERO ================= -->
        <div class="auth-hero">
            <!-- Cột trái: trang trí + marketing -->

            <div class="auth-hero-content">
                <h1>
                    Chào mừng đến<br>
                    <span>Bếp Nhà Ngọ</span>
                </h1>

                <!-- slogan -->
                <p class="auth-hero-slogan">🐴 Ăn là Mê, Rước Lộc về!</p>

                <!-- mô tả -->
                <p class="auth-hero-desc">
                    Đăng nhập để đặt hàng nhanh hơn, theo dõi đơn hàng và nhận ưu đãi mùa Tết!
                </p>

                <!-- lợi ích -->
                <ul class="auth-hero-perks">
                    <li><i class="fas fa-bolt"></i> Đặt hàng siêu tốc</li>
                    <li><i class="fas fa-gift"></i> Nhận voucher giảm giá</li>
                    <li><i class="fas fa-truck"></i> Theo dõi giao hàng</li>
                </ul>
            </div>
        </div>

        <!-- ================= RIGHT: FORM ================= -->
        <div class="auth-form-side">

            <!-- Mascot (ảnh con ngựa 😄) -->
            <img src="assets/images/mascots/blogin.png"
                 alt="Ngựa Tết mời đăng nhập"
                 class="top-mascot">

            <div class="auth-card">
                <!-- Khung form chính -->

                <h2 class="auth-title">Tài khoản</h2>
                <p class="auth-subtitle">Đăng nhập hoặc tạo tài khoản mới</p>

                <!-- ================= CHỌN LOGIN / REGISTER ================= -->
                <div id="choiceBox" class="auth-choice">
                    <!-- Ban đầu hiện phần này -->

                    <button id="showLogin" class="auth-btn primary">
                        <i class="fas fa-sign-in-alt"></i> Đăng nhập
                    </button>

                    <div class="auth-divider">
                        <span>hoặc</span>
                    </div>

                    <button id="showRegister" class="auth-btn outline">
                        <i class="fas fa-user-plus"></i> Tạo tài khoản mới
                    </button>
                </div>

                <!-- ================= FORM LOGIN ================= -->
                <form id="loginForm" class="auth-form hidden">
                    <!-- hidden = ban đầu bị ẩn -->

                    <!-- nút quay lại -->
                    <button type="button" class="backBtn">
                        <i class="fas fa-arrow-left"></i> Quay lại
                    </button>

                    <h3 class="form-heading">Đăng nhập</h3>

                    <!-- Email -->
                    <div class="input-group">
                        <label for="loginEmail">
                            <i class="fas fa-envelope"></i> Email
                        </label>
                        <input type="email"
                               id="loginEmail"
                               placeholder="vd: ngua@bepnhango.vn"
                               class="auth-input"
                               required>
                    </div>

                    <!-- Password -->
                    <div class="input-group">
                        <label for="loginPassword">
                            <i class="fas fa-lock"></i> Mật khẩu
                        </label>

                        <div class="password-box">
                            <!-- input password -->
                            <input type="password"
                                   id="loginPassword"
                                   placeholder="Nhập mật khẩu"
                                   class="auth-input"
                                   required>

                            <!-- icon show/hide password -->
                            <i class="fa-solid fa-eye togglePassword"></i>
                        </div>
                    </div>

                    <!-- tùy chọn -->
                    <div class="form-options">
                        <label class="remember-me">
                            <input type="checkbox"> Ghi nhớ
                        </label>

                        <a href="#" class="forgot-link">Quên mật khẩu?</a>
                    </div>

                    <!-- submit -->
                    <button type="submit" class="auth-btn primary">
                        <i class="fas fa-sign-in-alt"></i> Đăng nhập
                    </button>
                </form>

                <!-- ================= FORM REGISTER ================= -->
                <form id="registerForm" class="auth-form hidden">

                    <button type="button" class="backBtn">
                        <i class="fas fa-arrow-left"></i> Quay lại
                    </button>

                    <h3 class="form-heading">Tạo tài khoản</h3>

                    <!-- Tên -->
                    <div class="input-group">
                        <label for="name">
                            <i class="fas fa-user"></i> Họ và tên
                        </label>
                        <input type="text"
                               id="name"
                               placeholder="vd: Nguyễn Văn Ngọ"
                               class="auth-input"
                               required>
                    </div>

                    <!-- Email -->
                    <div class="input-group">
                        <label for="registerEmail">
                            <i class="fas fa-envelope"></i> Email
                        </label>
                        <input type="email"
                               id="registerEmail"
                               placeholder="vd: ngua@bepnhango.vn"
                               class="auth-input"
                               required>
                    </div>

                    <!-- Phone -->
                    <div class="input-group">
                        <label for="registerPhone">
                            <i class="fas fa-phone"></i> Số điện thoại
                        </label>
                        <input type="tel"
                               id="registerPhone"
                               placeholder="vd: 0909 123 456"
                               class="auth-input"
                               required>
                    </div>

                    <!-- Password -->
                    <div class="input-group">
                        <label for="registerPassword">
                            <i class="fas fa-lock"></i> Mật khẩu
                        </label>

                        <div class="password-box">
                            <input type="password"
                                   id="registerPassword"
                                   placeholder="Tối thiểu 6 ký tự"
                                   class="auth-input"
                                   required>

                            <i class="fa-solid fa-eye togglePassword"></i>
                        </div>
                    </div>

                    <!-- Confirm Password -->
                    <div class="input-group">
                        <label for="confirmPassword">
                            <i class="fas fa-lock"></i> Xác nhận mật khẩu
                        </label>

                        <div class="password-box">
                            <input type="password"
                                   id="confirmPassword"
                                   placeholder="Nhập lại mật khẩu"
                                   class="auth-input"
                                   required>

                            <i class="fa-solid fa-eye togglePassword"></i>
                        </div>
                    </div>

                    <!-- submit -->
                    <button type="submit" class="auth-btn primary">
                        <i class="fas fa-user-plus"></i> Đăng ký
                    </button>
                </form>
            </div>
        </div>
    </main>

    <!-- FOOTER (load động) -->
    <footer class="footer"></footer>

    <!-- JS -->
    <script src="assets/js/main.js"></script>
    <!-- thường dùng load header/footer -->

    <script src="assets/js/script.js"></script>
    <!-- logic chung -->

    <script src="assets/js/login.js"></script>
    <!-- xử lý login/register (toggle form, validate...) -->

</body>
</html>
