<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Responsive: nói cho trình duyệt mobile biết là đừng thu nhỏ trang, hiển thị đúng kích thước -->

    <meta name="description" content="Đăng nhập hoặc đăng ký tài khoản Bếp Nhà Ngọ">
    <!-- Mô tả ngắn hiện trên Google khi search, giúp SEO tốt hơn -->

    <title>Đăng nhập - Bếp Nhà Ngọ</title>
    <!-- Tiêu đề hiện trên tab trình duyệt -->

    <!-- Preconnect để kết nối trước với Google Fonts, tải font nhanh hơn -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <!-- Import 2 font: Playfair Display (chữ serif đẹp cho tiêu đề) + Be Vietnam Pro (chữ thường) -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Favicon: ảnh icon nhỏ hiện trên tab, dùng logo của quán -->
    <link rel="icon" type="image/png" href="assets/images/ui/logo.png">

    <!-- Font Awesome: thư viện icon miễn phí, dùng kiểu CDN cho tiện -->
    <!-- Dùng các icon như fa-sign-in-alt, fa-eye, fa-lock, fa-envelope... -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <!-- CSS chung cho toàn bộ trang (biến màu, font, reset...) -->
    <link rel="stylesheet" href="assets/css/style.css">

    <!-- CSS của trang chủ - load thêm vì trang login dùng chung một số style header/footer -->
    <link rel="stylesheet" href="assets/css/index.css">

    <!-- CSS riêng cho trang đăng nhập / đăng ký -->
    <link rel="stylesheet" href="assets/css/login.css">
</head>

<body>

    <!-- HEADER: để trống, JS trong main.js sẽ fetch và nhét header.html vào đây -->
    <header class="header"></header>

    <main class="auth-page">
        <!-- Trang này chia 2 cột: trái là hero/quảng cáo, phải là form đăng nhập -->

        <!-- ================= CỘT TRÁI: HERO / QUẢNG CÁO ================= -->
        <div class="auth-hero">
            <!-- Phần trang trí bên trái: gradient đỏ, có chữ chào mừng và list lợi ích -->

            <div class="auth-hero-content">
                <h1>
                    Chào mừng đến<br>
                    <span>Bếp Nhà Ngọ</span>
                    <!-- span để đổi màu "Bếp Nhà Ngọ" thành màu vàng gold -->
                </h1>

                <!-- Slogan ngắn, vui vẻ theo chủ đề Tết -->
                <p class="auth-hero-slogan">🐴 Ăn là Mê, Rước Lộc về!</p>

                <!-- Mô tả thêm lý do cần đăng nhập -->
                <p class="auth-hero-desc">
                    Đăng nhập để đặt hàng nhanh hơn, theo dõi đơn hàng và nhận ưu đãi mùa Tết!
                </p>

                <!-- Danh sách 3 lợi ích khi đăng nhập, dùng icon Font Awesome cho đẹp -->
                <ul class="auth-hero-perks">
                    <li><i class="fas fa-bolt"></i> Đặt hàng siêu tốc</li>
                    <li><i class="fas fa-gift"></i> Nhận voucher giảm giá</li>
                    <li><i class="fas fa-truck"></i> Theo dõi giao hàng</li>
                </ul>
            </div>
        </div>

        <!-- ================= CỘT PHẢI: FORM ĐĂNG NHẬP / ĐĂNG KÝ ================= -->
        <div class="auth-form-side">

            <!-- Ảnh mascot con ngựa, đặt absolute ở góc bên phải cho vui -->
            <img src="assets/images/mascots/blogin.png"
                 alt="Ngựa Tết mời đăng nhập"
                 class="top-mascot">

            <div class="auth-card">
                <!-- Khung card trắng chứa toàn bộ phần form bên trong -->

                <h2 class="auth-title">Tài khoản</h2>
                <p class="auth-subtitle">Đăng nhập hoặc tạo tài khoản mới</p>

                <!-- ================= PHẦN CHỌN: ĐĂNG NHẬP hay ĐĂNG KÝ ================= -->
                <!-- Ban đầu hiện 2 nút này, khi bấm thì JS sẽ ẩn đi và hiện form tương ứng -->
                <div id="choiceBox" class="auth-choice">

                    <!-- Nút đăng nhập: class "primary" = kiểu nút vàng nổi bật -->
                    <button id="showLogin" class="auth-btn primary">
                        <i class="fas fa-sign-in-alt"></i> Đăng nhập
                    </button>

                    <!-- Dòng "hoặc" giữa 2 nút -->
                    <div class="auth-divider">
                        <span>hoặc</span>
                    </div>

                    <!-- Nút đăng ký: class "outline" = kiểu nút viền, không nền -->
                    <button id="showRegister" class="auth-btn outline">
                        <i class="fas fa-user-plus"></i> Tạo tài khoản mới
                    </button>
                </div>

                <!-- ================= FORM ĐĂNG NHẬP ================= -->
                <!-- class="hidden" → ẩn mặc định, JS remove class này khi người dùng bấm "Đăng nhập" -->
                <form id="loginForm" class="auth-form hidden">

                    <!-- Nút quay lại để trở về màn hình chọn ban đầu -->
                    <button type="button" class="backBtn">
                        <i class="fas fa-arrow-left"></i> Quay lại
                    </button>

                    <h3 class="form-heading">Đăng nhập</h3>

                    <!-- Trường Email -->
                    <div class="input-group">
                        <label for="loginEmail">
                            <i class="fas fa-envelope"></i> Email
                        </label>
                        <!-- type="email" để trình duyệt tự validate định dạng email cơ bản -->
                        <input type="email"
                               id="loginEmail"
                               placeholder="vd: ngua@bepnhango.vn"
                               class="auth-input"
                               required>
                        <!-- required: HTML5 tự báo lỗi nếu để trống, nhưng JS vẫn kiểm tra thêm -->
                    </div>

                    <!-- Trường Mật khẩu -->
                    <div class="input-group">
                        <label for="loginPassword">
                            <i class="fas fa-lock"></i> Mật khẩu
                        </label>

                        <!-- password-box để chứa input + icon mắt cùng 1 hàng (position relative/absolute) -->
                        <div class="password-box">
                            <input type="password"
                                   id="loginPassword"
                                   placeholder="Nhập mật khẩu"
                                   class="auth-input"
                                   required>

                            <!-- Icon mắt: bấm vào để show/hide mật khẩu, JS xử lý trong login.js -->
                            <i class="fa-solid fa-eye togglePassword"></i>
                        </div>
                    </div>

                    <!-- Tùy chọn: checkbox "ghi nhớ" và link "quên mật khẩu" -->
                    <div class="form-options">
                        <label class="remember-me">
                            <input type="checkbox"> Ghi nhớ
                            <!-- Checkbox này chưa được xử lý JS (chưa lưu gì cả, để sau làm thêm) -->
                        </label>

                        <a href="#" class="forgot-link">Quên mật khẩu?</a>
                        <!-- Link này cũng chưa làm chức năng, placeholder tạm thôi -->
                    </div>

                    <!-- Nút submit form đăng nhập -->
                    <button type="submit" class="auth-btn primary">
                        <i class="fas fa-sign-in-alt"></i> Đăng nhập
                    </button>
                </form>

                <!-- ================= FORM ĐĂNG KÝ ================= -->
                <!-- Cũng ẩn mặc định, hiện lên khi bấm "Tạo tài khoản mới" -->
                <form id="registerForm" class="auth-form hidden">

                    <button type="button" class="backBtn">
                        <i class="fas fa-arrow-left"></i> Quay lại
                    </button>

                    <h3 class="form-heading">Tạo tài khoản</h3>

                    <!-- Trường Họ và tên -->
                    <div class="input-group">
                        <label for="name">
                            <i class="fas fa-user"></i> Họ và tên
                        </label>
                        <input type="text"
                               id="name"
                               placeholder="vd: Nguyễn Văn Ngọ"
                               class="auth-input"
                               required>
                    </div>

                    <!-- Trường Email đăng ký (id khác với email đăng nhập để JS phân biệt) -->
                    <div class="input-group">
                        <label for="registerEmail">
                            <i class="fas fa-envelope"></i> Email
                        </label>
                        <input type="email"
                               id="registerEmail"
                               placeholder="vd: ngua@bepnhango.vn"
                               class="auth-input"
                               required>
                    </div>

                    <!-- Trường Số điện thoại: type="tel" gợi ý bàn phím số trên mobile -->
                    <div class="input-group">
                        <label for="registerPhone">
                            <i class="fas fa-phone"></i> Số điện thoại
                        </label>
                        <input type="tel"
                               id="registerPhone"
                               placeholder="vd: 0909 123 456"
                               class="auth-input"
                               required>
                        <!-- JS sẽ kiểm tra regex số điện thoại Việt Nam (10 số, đầu 03/05/07/08/09) -->
                    </div>

                    <!-- Trường Mật khẩu mới -->
                    <div class="input-group">
                        <label for="registerPassword">
                            <i class="fas fa-lock"></i> Mật khẩu
                        </label>

                        <div class="password-box">
                            <input type="password"
                                   id="registerPassword"
                                   placeholder="Tối thiểu 6 ký tự"
                                   class="auth-input"
                                   required>

                            <i class="fa-solid fa-eye togglePassword"></i>
                        </div>
                    </div>

                    <!-- Trường Xác nhận mật khẩu: JS so sánh 2 password phải giống nhau -->
                    <div class="input-group">
                        <label for="confirmPassword">
                            <i class="fas fa-lock"></i> Xác nhận mật khẩu
                        </label>

                        <div class="password-box">
                            <input type="password"
                                   id="confirmPassword"
                                   placeholder="Nhập lại mật khẩu"
                                   class="auth-input"
                                   required>

                            <i class="fa-solid fa-eye togglePassword"></i>
                        </div>
                    </div>

                    <!-- Nút submit form đăng ký -->
                    <button type="submit" class="auth-btn primary">
                        <i class="fas fa-user-plus"></i> Đăng ký
                    </button>
                </form>
            </div>
        </div>
    </main>

    <!-- FOOTER: cũng load động như header -->
    <footer class="footer"></footer>

    <!-- main.js: load header/footer và các hàm chung như showToast, updateCartBadge -->
    <script src="assets/js/main.js"></script>

    <!-- script.js: các hàm chung khác, thứ tự load trước login.js -->
    <script src="assets/js/script.js"></script>

    <!-- login.js: xử lý đăng nhập, đăng ký, show/hide form, toggle mật khẩu -->
    <script src="assets/js/login.js"></script>

</body>
</html>
