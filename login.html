<!DOCTYPE html>
<html lang="vi">

<head>
    <!-- Khai báo bộ ký tự tiếng Việt và thiết lập giao diện responsive -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Mô tả trang — hiển thị khi chia sẻ link hoặc tìm kiếm trên Google -->
    <meta name="description"
        content="Bếp Nhà Ngọ - Ăn là Mê, Rước Lộc về! Món ăn Tết truyền thống, giao hàng tận nơi tại Cần Thơ. Bánh tét, bánh chưng, đồ nhậu Tết chất lượng.">
    <title>Bếp Nhà Ngọ - Ăn là Mê, Rước Lộc về!</title>

    <!-- Google Fonts: Baloo 2 (tiêu đề vui), Nunito (nội dung), Cormorant Garamond (sang trọng), Inter (giao diện) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap"
        rel="stylesheet">

    <!-- Favicon - icon nhỏ hiển thị trên tab trình duyệt -->
    <link rel="icon" type="image/png" href="assets/images/logo.png">

    <!-- Font Awesome - thư viện icon (giỏ hàng, tìm kiếm, mạng xã hội...) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <!-- CSS: style.css (dùng chung)-->
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="assets/css/index.css">
    <link rel="stylesheet" href="assets/css/login.css">
</head>

<body>

     <header class="header"></header>
<!-- MAIN -->

<main class="auth-wrapper">
<div class="auth-card">
<h2 class="auth-title">Tài khoản</h2>

<!-- lựa chọn -->

<div id="choiceBox" class="auth-choice">

<button id="showLogin" class="auth-btn">
Đăng nhập
</button>

<button id="showRegister" class="auth-btn outline">
Đăng ký
</button>

</div>
<!-- LOGIN -->

<form id="loginForm" class="auth-form hidden">
<button type="button" class="backBtn">← Quay lại</button>
<input
type="email"
id="loginEmail"
placeholder="Email"
class="auth-input"
required
>

<div class="password-box">

<input
type="password"
id="loginPassword"
placeholder="Mật khẩu"
class="auth-input"
required
>

<i class="fa-solid fa-eye togglePassword"></i>

</div>

<button class="auth-btn">
Đăng nhập
</button>

</form>



<!-- REGISTER -->

<form id="registerForm" class="auth-form hidden">

<button type="button" class="backBtn">← Quay lại</button>

<input
type="text"
id="name"
placeholder="Tên"
class="auth-input"
required
>

<input
type="email"
id="registerEmail"
placeholder="Email"
class="auth-input"
required
>

<div class="password-box">

<input
type="password"
id="registerPassword"
placeholder="Mật khẩu"
class="auth-input"
required
>

<i class="fa-solid fa-eye togglePassword"></i>

</div>

<button class="auth-btn">
Đăng ký
</button>

</form>

</div>

</main>

    <footer class="footer"></footer>

    <!-- JavaScript chính của trang -->
    <script src="assets/js/script.js"></script>
    <script src="assets/js/main.js"></script>
    <script src="assets/js/login.js"></script>
    
</body>
</html>
